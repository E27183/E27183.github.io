        const valid_zhuyin_combos_length = valid_zhuyin_combos.length;
        var handle_key;
        const codeMap = new Map([["Minus", "ㄦ"], ["Digit0", "ㄢ"], ["Digit1", "ㄅ"], ["Digit2", "ㄉ"], ["Digit3", "ˇ"], ["Digit4", "ˋ"], ["Digit5", "ㄓ"], ["Digit6", "ˊ"], ["Digit7", "˙"], ["Digit8", "ㄚ"], ["Digit9", "ㄞ"], ["KeyQ", "ㄆ"], ["KeyW", "ㄊ"], ["KeyE", "ㄍ"], ["KeyR", "ㄐ"], ["KeyT", "ㄔ"], ["KeyY", "ㄗ"], ["KeyU", "ㄧ"], ["KeyI", "ㄛ"], ["KeyO", "ㄟ"], ["KeyP", "ㄣ"], ["KeyA", "ㄇ"], ["KeyS", "ㄋ"], ["KeyD", "ㄎ"], ["KeyF", "ㄑ"], ["KeyG", "ㄕ"], ["KeyH", "ㄘ"], ["KeyJ", "ㄨ"], ["KeyK", "ㄜ"], ["KeyL", "ㄠ"], ["Semicolon", "ㄤ"], ["KeyZ", "ㄈ"], ["KeyX", "ㄌ"], ["KeyC", "ㄏ"], ["KeyV", "ㄒ"], ["KeyB", "ㄖ"], ["KeyN", "ㄙ"], ["KeyM", "ㄩ"], ["Comma", "ㄝ"], ["Period", "ㄡ"], ["Slash", "ㄥ"]]);
        var colourMap = new Map([[0, "green"], [1, "red"], [2, "orange"]]);
        var typing_results_array;
        var active_line;
        var upcoming_line;
        var keyboard_coloured = [];
        function generate_valid_line(terminal_length) {
            let current_length = 0;
            let builder = [];
            while (current_length < terminal_length) {
                let i = Math.floor(Math.random() * valid_zhuyin_combos_length);
                builder.push(valid_zhuyin_combos[i]);
                let j = Math.floor(Math.random() * 5);
                builder.push(valid_tones[j]);
                current_length += valid_zhuyin_combos[i].length + valid_tones[j].length;
            }
            return builder.join(" ");
        }
        document.addEventListener("DOMContentLoaded", () => {
            const keyboard_visibility = document.getElementById("keyboard_visibility");
            const keyboard_section = document.getElementById("keyboard_section");
            const keyboard_hideables = document.getElementsByClassName("hideable1");
            const primary_para = document.getElementById("main1");
            const secondary_para = document.getElementById("main2");
            const single_char = document.getElementById("simple");
            const single_char_para = document.getElementById("single1");
            const single_char_testing_cols = document.getElementById("single_char_testing");
            const sctc_label = document.getElementById("sctc_label");
            const sctc_ids = ["s1", "s2", "s3", "s4", "s5", "s6", "s7", "s8", "s9", "s10", "s11"];
            function update_single_char(key = null) {
                let sctc_selected = sctc_ids.filter((s) => {
                    return document.getElementById(s).checked;
                });
                var row;
                if (sctc_selected[0] == "s11") {
                    single_char_para.textContent = "ㄦ";
                    if (key != null) {
                        colour_keyboard(key, single_char_para.textContent);
                    }
                    return;
                }
                if (sctc_selected.length == 0) {
                    row = Math.floor(Math.random() * valid_characters.length);
                } else {
                    let c = Math.floor(Math.random() * sctc_selected.length);
                    row = parseInt(sctc_selected[c].substring(1)) - 1;
                }
                if (row == 10 && Math.random() < 0.75) {
                    update_single_char(key);
                    return;
                }
                let id = Math.floor(Math.random() * valid_characters[row].length);
                if (valid_characters[row][id] == single_char_para.textContent) {
                    update_single_char(key);
                    return;
                }
                if (key != null) {
                    colour_keyboard(key, single_char_para.textContent);
                }
                single_char_para.textContent = valid_characters[row][id];
            }
            function colour_keyboard(attempt, correct) {
                for (var c of keyboard_coloured) {
                    document.getElementById(c).classList.remove("greenbg", "redbg", "cyanbg");
                }
                keyboard_coloured = [correct];
                if (correct != attempt) {
                    document.getElementById(attempt).classList.add("redbg");
                    document.getElementById(correct).classList.add("cyanbg");
                    keyboard_coloured.push(attempt);
                } else {
                    document.getElementById(correct).classList.add("greenbg");
                }
            }
            function set_line_display() {
                let out = [];
                for (i in typing_results_array) {
                    out.push(`<span class="${colourMap.get(typing_results_array[i])}">${active_line[i]}</span>`);
                }
                out.push(active_line.substring(typing_results_array.length));
                return out.join("");
            }
            function new_typing_line() {
                if (!upcoming_line) {
                    upcoming_line = generate_valid_line(50);
                }
                typing_results_array = [2];
                typing_index = 0;
                active_line = upcoming_line;
                upcoming_line = generate_valid_line(50);
                secondary_para.textContent = upcoming_line;
                primary_para.innerHTML = set_line_display();
            }
            handle_key = (key) => {
                if (single_char.checked) {
                    update_single_char(key);
                } else {
                    let typing_len = typing_results_array.length
                    let p = typing_len - 1;
                    colour_keyboard(key, active_line[p]);
                    if (key == active_line[p]) {
                        typing_results_array[p] = 0;
                    } else {
                        typing_results_array[p] = 1;
                    }
                    let returnFlag = 0;
                    function handle_whitespace() {
                        p++;
                        if (p >= active_line.length) {
                            returnFlag = 1;
                        } else if (active_line[p] == " ") {
                            typing_results_array.push(0);
                            handle_whitespace();
                        }
                    }
                    handle_whitespace();
                    if (returnFlag == 1) {
                        new_typing_line();
                        return;
                    }
                    typing_results_array.push(2);
                    primary_para.innerHTML = set_line_display();
                }
            }
            function visibility_handler() {
                if (keyboard_visibility.checked) {
                    for (const e of keyboard_hideables) {
                        e.classList.remove("hidden");
                    }
                } else {
                    for (const e of keyboard_hideables) {
                        e.classList.add("hidden");
                    }
                }
            };
            keyboard_visibility.addEventListener("change", visibility_handler);
            function single_char_handler() {
                if (single_char.checked) {
                    primary_para.classList.add("removed");
                    secondary_para.classList.add("removed");
                    single_char_para.classList.remove("removed");
                    single_char_testing_cols.classList.remove("removed");
                    sctc_label.classList.remove("removed");
                } else {
                    primary_para.classList.remove("removed");
                    secondary_para.classList.remove("removed");
                    single_char_para.classList.add("removed");
                    single_char_testing_cols.classList.add("removed");
                    sctc_label.classList.add("removed");
                }
            }
            single_char.addEventListener("change", single_char_handler);
            document.onkeypress = (e) => {
                e = e || window.event;
                if (Array.from(codeMap.keys()).includes(e.code)) {
                    handle_key(codeMap.get(e.code));
                }
                e.preventDefault();
            };
            new_typing_line();
            visibility_handler();
            single_char_handler();
            update_single_char();
        });
